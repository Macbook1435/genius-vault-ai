<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Genius Vault AI</title><style>body{font-family:Arial,sans-serif;background:#0b0f19;color:white;margin:20px}main{max-width:900px;margin:auto}h1,a{color:#00ff88}.box{background:#151b2b;padding:18px;border-radius:14px;margin:15px 0}input,button{width:100%;padding:12px;margin:8px 0;box-sizing:border-box}button{background:#00c853;color:white;border:0;border-radius:10px;font-size:18px;cursor:pointer}button:disabled{opacity:.5}.result{background:#101828;padding:15px;white-space:pre-wrap;overflow-wrap:anywhere}img{display:none;max-width:320px;max-height:390px;margin:12px auto}</style></head><body><main><h1>Genius Vault AI</h1><p>Sports Card Scanner</p><section class="box"><h2>Upload card</h2><label for="front">Front</label><input id="front" type="file" accept="image/*"><img id="frontPreview" alt="Front preview"><label for="back">Back (recommended)</label><input id="back" type="file" accept="image/*"><img id="backPreview" alt="Back preview"><button id="scanButton">RUN AI SCAN</button></section><section class="box"><h2>AI Scan Output</h2><div id="output" class="result" role="status">Upload a card and run a scan.</div><div id="compsTools" hidden><label for="searchCopy">Sold comps search phrase</label><input id="searchCopy" readonly><button id="copyButton">COPY SEARCH PHRASE</button><a id="pointLink" target="_blank" rel="noopener noreferrer">Open 130Point Sold Comps</a></div></section><section class="box"><h2>TikTok Generator</h2><button id="tiktokButton" disabled>GENERATE TIKTOK POST</button><div id="tiktokBox" class="result">Scan and verify first.</div></section><section class="box"><h2>eBay Generator</h2><button id="ebayButton" disabled>GENERATE EBAY LISTING</button><div id="ebayBox" class="result">Scan and verify first.</div></section></main><script>
const $=id=>document.getElementById(id);let card=null;const show=v=>v==null||v===""?"Not identified":String(v);
function reset(){card=null;$("compsTools").hidden=true;$("tiktokButton").disabled=true;$("ebayButton").disabled=true;$("tiktokBox").textContent="Scan and verify first.";$("ebayBox").textContent="Scan and verify first.";$("output").textContent="Image changed. Run a scan."}
function preview(input,view){const file=$(input).files[0],image=$(view);if(image.dataset.url)URL.revokeObjectURL(image.dataset.url);image.removeAttribute("src");image.style.display="none";if(file){image.dataset.url=URL.createObjectURL(file);image.src=image.dataset.url;image.style.display="block"}}
function compress(file){return new Promise((resolve,reject)=>{const img=new Image(),reader=new FileReader();reader.onload=e=>{img.onload=()=>{const scale=Math.min(1,1200/img.width),canvas=document.createElement("canvas");canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);const ctx=canvas.getContext("2d");if(!ctx)return reject(new Error("Image processing failed."));ctx.drawImage(img,0,0,canvas.width,canvas.height);canvas.toBlob(blob=>blob?resolve(blob):reject(new Error("Compression failed.")),"image/jpeg",.75)};img.onerror=()=>reject(new Error("Cannot open image."));img.src=e.target.result};reader.onerror=()=>reject(new Error("Cannot read image."));reader.readAsDataURL(file)})}
function render(data){const c=data.scan,query=data.soldComps?.query||"";card=c&&data.confidence!=="low"?c:null;$("tiktokButton").disabled=!card;$("ebayButton").disabled=!card;$("output").textContent=[data.results,data.readoutSummary,c?`Player: ${show(c.player)}`:null,c?`Year: ${show(c.year)}`:null,c?`Brand / Set: ${[c.brand,c.set].filter(Boolean).join(" ")||"Not identified"}`:null,c?`Card Number: ${show(c.cardNumber)}`:null,c?`Parallel: ${show(c.parallel)}`:null,`Confidence: ${show(data.confidence)}`,c?`Notes: ${show(c.notes)}`:null,"Sold prices: Not verified; check exact matching sales manually."].filter(Boolean).join("\n");$("compsTools").hidden=!card||!query;if(card&&query){$("searchCopy").value=query;$("pointLink").href="https://130point.com/sales/?search="+encodeURIComponent(query)}}
async function scan(){const front=$("front").files[0];if(!front){$("output").textContent="Upload a front photo first.";return}reset();$("scanButton").disabled=true;$("output").textContent="Scanning card...";try{const form=new FormData();form.append("image",await compress(front),"front.jpg");const back=$("back").files[0];if(back)form.append("back",await compress(back),"back.jpg");const response=await fetch("/api/scan",{method:"POST",body:form});const data=await response.json();if(!response.ok)throw new Error(data.error||data.results||"Scan failed.");render(data)}catch(error){$("output").textContent=error.message||"Scan failed."}finally{$("scanButton").disabled=false}}
function title(c){return[c.year,c.brand,c.set,c.player,c.parallel,c.cardNumber?`#${c.cardNumber}`:""].filter(Boolean).join(" " )}
$("front").onchange=()=>{preview("front","frontPreview");reset()};$("back").onchange=()=>{preview("back","backPreview");reset()};$("scanButton").onclick=scan;$("copyButton").onclick=async()=>{try{await navigator.clipboard.writeText($("searchCopy").value);$("copyButton").textContent="COPIED"}catch{$("searchCopy").select();$("output").textContent+="\nSelect and copy the phrase manually."}};$("tiktokButton").onclick=()=>{if(card)$("tiktokBox").textContent=`Fresh card scan: ${title(card)}. Verify card details and prices before posting. Would you hold or sell? #sportscards #thehobby`};$("ebayButton").onclick=()=>{if(card)$("ebayBox").textContent=`Title: ${title(card)}\n\nDescription: Actual card shown in photos. Verify player, set, parallel, card number, condition and matching sold prices before publishing. Ships protected with care.`};
</script></body></html>
