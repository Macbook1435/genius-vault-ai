<!DOCTYPE html>
<html>
<head>
  <title>Genius Vault AI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0b0f19;
      color: white;
      margin: 0;
      padding: 20px;
      text-align: center;
    }

    .container {
      max-width: 900px;
      margin: auto;
    }

    h1 {
      color: #00ff88;
    }

    .hero-img {
      width: 100%;
      max-width: 420px;
      border-radius: 18px;
      margin-bottom: 20px;
    }

    .box {
      background: #151b2b;
      padding: 18px;
      border-radius: 14px;
      margin: 15px 0;
      text-align: left;
    }

    input, textarea {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border-radius: 8px;
      border: none;
      font-size: 16px;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      padding: 16px;
      background: #00c853;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 20px;
      font-weight: bold;
      margin-top: 10px;
      cursor: pointer;
    }

    #preview {
      max-width: 320px;
      width: 100%;
      display: none;
      margin: 15px auto;
      border-radius: 12px;
    }

    .result {
      background: #101828;
      padding: 15px;
      border-radius: 12px;
      margin-top: 15px;
      white-space: pre-wrap;
    }
.scanner-frame {
  position: relative;
  width: 280px;
  height: 390px;
  margin: 20px auto;
  border-radius: 20px;
}

.scanner-frame span {
  position: absolute;
  width: 40px;
  height: 40px;
  border: 4px solid white;
}

.scanner-frame span:nth-child(1) {
  top: 0;
  left: 0;
  border-right: none;
  border-bottom: none;
}

.scanner-frame span:nth-child(2) {
  top: 0;
  right: 0;
  border-left: none;
  border-bottom: none;
}

.scanner-frame span:nth-child(3) {
  bottom: 0;
  left: 0;
  border-right: none;
  border-top: none;
}

.scanner-frame span:nth-child(4) {
  bottom: 0;
  right: 0;
  border-left: none;
  border-top: none;
}
  .preview-container {
  position: relative;
  width: 280px;
  height: 390px;
  margin: 20px auto;
}

.preview-container #preview {
  width: 100%;
  height: 100%;
  object-fit: contain;
  transform: scale(1.05);
  object-position: center;
  display: block;
  border-radius: 12px;
  position: relative;
  top: 0;
  left: 0;
  z-index: 5;
}
 
.preview-container .scanner-frame {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  margin: 0;
  z-index: 10;
}
.manual-search-button {
  display: block;
  width: 100%;
  box-sizing: border-box;
  margin-top: 16px;
  padding: 18px 14px;
  border-radius: 14px;
  background: #00d95a;
  color: #061019;
  font-size: 20px;
  font-weight: 800;
  line-height: 1.2;
  letter-spacing: 0.4px;
  text-align: center;
  text-decoration: none;
}
    
  </style>
</head>

<body>
  <div class="container">

    <h1>Genius Vault AI</h1>
    <p>AI Sports Card Scanner + Profit Generator</p>

  <div class="box">
  <h2>1. Upload Card Image</h2>

  <input type="file" id="imageUpload" accept="image/*" onchange="previewImage()">
  
<label style="display:block;margin-top:10px;">Upload Back of Card</label>
<input type="file" id="backImageUpload" accept="image/*" onchange="previewBackImage()">

<label style="display:block;margin-top:10px;">Optional: Close-up of Serial Number (e.g. 06/10)</label>
<input type="file" id="serialUpload" accept="image/*" onchange="previewSerialImage()">
<img id="serialPreview" style="max-width:200px;width:100%;display:none;margin:10px auto;border-radius:12px;">

<img id="backPreview" style="max-width:320px;width:100%;display:none;margin:15px auto;border-radius:12px;">
  <div class="preview-container">
    
     <img id="preview">
    
     <div class="scanner-frame">
      <span></span>
      <span></span>
      <span></span>
      <span></span>
     </div>
        
    
    
  </div>
    
  </div>

  <button onclick="aiScan()">RUN AI SCAN</button>
</div>
    <div class="box">
      <h2>4. TikTok Generator</h2>
      <button onclick="generateTikTok()">GENERATE TIKTOK POST</button>
      <div id="tiktokBox" class="result">TikTok post will appear here...</div>
    </div>

    <div class="box">
      <h2>5. eBay Generator</h2>
      <button onclick="generateEbay()">GENERATE EBAY LISTING</button>
      <div id="ebayBox" class="result">eBay listing will appear here...</div>
    </div>

    <div class="box">
      <h2>AI Scan Output</h2>
      <div id="output" class="result">Upload a card and press RUN AI SCAN.</div>
    </div>

  </div>

<script>
function previewImage() {
  const file = document.getElementById("imageUpload").files[0];
  const preview = document.getElementById("preview");

  if (file) {
    preview.src = URL.createObjectURL(file);
    preview.style.display = "block";
  }
}

  
function previewBackImage() {
  const file = document.getElementById("backImageUpload").files[0];
  const preview = document.getElementById("backPreview");

  if (file) {
    preview.src = URL.createObjectURL(file);
    preview.style.display = "block";
  }
}

function previewSerialImage() {
  const file = document.getElementById("serialUpload").files[0];
  const preview = document.getElementById("serialPreview");

  if (file) {
    preview.src = URL.createObjectURL(file);
    preview.style.display = "block";
  }
}

function compressImage(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const reader = new FileReader();

    reader.onload = e => {
      img.onload = () => {
        const canvas = document.createElement("canvas");
        const maxWidth = 1200;
        const scale = Math.min(1, maxWidth / img.width);

        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);

        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

        canvas.toBlob(
          blob => {
            if (blob) resolve(blob);
            else reject(new Error("Image compression failed"));
          },
          "image/jpeg",
          0.75
        );
      };

      img.onerror = reject;
      img.src = e.target.result;
    };

    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
async function aiScan() {
  const fileInput = document.getElementById("imageUpload");
  const backFileInput = document.getElementById("backImageUpload");
  const file = fileInput.files[0];
  const backFile = backFileInput.files[0];
  const output = document.getElementById("output");

  if (!file) {
    alert("Upload a card photo first");
    return;
  }

  output.innerHTML = "Scanning card with OpenAI AI Vision...";

  const frontBlob = await compressImage(file);
  const formData = new FormData();
  formData.append("image", frontBlob, "front.jpg");

  if (backFile) {
    const backBlob = await compressImage(backFile);
    formData.append("back", backBlob, "back.jpg");
  }

  const serialFile = document.getElementById("serialUpload").files[0];
  if (serialFile) {
    const serialBlob = await compressImage(serialFile);
    formData.append("serial", serialBlob, "serial.jpg");
  }

  try {
    const response = await fetch("/api/scan", {
      method: "POST",
      body: formData
    });

    const data = await response.json();
    window.gvLast = data;
    renderScan(data);

  } catch (error) {
    console.error(error);
    output.innerHTML = error.message || "AI scan failed.";
  }
}
// Renders the scan output. Called again when the user picks a parallel.
function renderScan(data) {
  const output = document.getElementById("output");
    let results = data.results || "No scan result returned.";
    const card = data.scan || {};
const comps = data.comps || {};
    if (data.scan) {
  results = [
    `Player: ${card.player || "Not identified"}`,
    `Year: ${card.year || "Not identified"}`,
    `Brand / Set: ${[card.brand, card.set].filter(Boolean).join(" ") || "Not identified"}`,
    `Card Number: ${card.cardNumber || "Not identified"}`,
    `Parallel / Insert: ${card.parallel || (data.pipeline?.fields?.parallel?.status === "confirmed" && data.pipeline.fields.parallel.value === "Base" ? "Base" : "Not identified")}`,
    `Numbered: ${card.serialNumber && !data.pipeline?.fields?.serial?.printRunConfirmed ? card.serialNumber : card.numberedTo ? `/${card.numberedTo}` : "Not identified"}`,
    `Autograph: ${card.autograph ? "Yes" : "No"}`,
    `Rookie: ${card.rookie ? "Yes" : "No"}`,
    `Listing Title: ${data.soldComps?.query || "Needs review — confirm card details first"}`,
    `Estimated Value Range: ${comps.count ? `$${comps.min}–$${comps.max} (${comps.count} sold listings; verify matches)` : "No sold prices auto-loaded"}`,
    `Sold comps status: ${comps.error || "No error reported"}`,
    `Verification: ${data.verification?.status || "needs_review"}${data.verification?.warnings?.length ? " — " + data.verification.warnings.join(" ") : ""}`,
  `Confidence: ${data.confidence || "Not available"}`,
    `Notes: ${card.notes || "None"}`,
    ...fieldCheckLines(data)
  ].join("\n");
}



  const searchText = (data.soldComps?.query || "sports card").trim();

    const pointUrl =
      "https://130point.com/sales/?search=" + encodeURIComponent(searchText);

    output.innerHTML =
      results.replace(/\n/g, "<br>") +
      `<br><br>
      <div style="margin-top:15px;padding:12px;background:#151b2b;border-radius:10px;">
        <b style="color:#00ff88;">COPY SEARCH PHRASE:</b><br><br>
        <input
          type="text"
          value="${searchText.replace(/"/g, "&quot;")}"
          id="searchCopyBox"
          readonly
          style="width:100%;padding:10px;border-radius:8px;border:none;font-size:16px;margin-bottom:10px;"
        >
        <button onclick="copySearchText()" style="background:#00c853;color:white;border:none;padding:12px;border-radius:8px;width:100%;font-weight:bold;cursor:pointer;">
          COPY SEARCH PHRASE
        </button>
        <br><br>
        <a href="${pointUrl}" target="_blank" style="color:#00ff88;font-weight:bold;text-decoration:none;">
          Open 130Point Sold Comps
        </a>
      </div>`;

  output.innerHTML += parallelPickerHtml(data);
}

const escHtml = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

// "Pick the parallel" menu: every parallel CardSight lists for this exact card.
function parallelPickerHtml(data) {
  const pk = data.parallelPicker;
  if (!pk || !pk.options?.length) return "";
  const label = (o) => `${o.name}${o.numberedTo ? ` /${o.numberedTo}` : ""}`;
  const sugg = new Set(pk.suggestions || []);
  const top = pk.options.filter((o) => sugg.has(o.name));
  const rest = pk.options.filter((o) => !sugg.has(o.name));
  const opt = (o) => `<option value="${escHtml(o.id)}" ${pk.selectedId === o.id ? "selected" : ""}>${escHtml(label(o))}</option>`;
  const sales = (data.comps?.items || []).slice(0, 5).map((i) =>
    `<div style="font-size:14px;margin:4px 0;">$${Number(i.price).toFixed(2)} · ${escHtml((i.date || "").slice(0, 10))} · <a href="${escHtml(i.url)}" target="_blank" style="color:#00ff88;">${escHtml((i.title || "sale").slice(0, 60))}</a></div>`).join("");
  return `<div style="margin-top:15px;padding:12px;background:#151b2b;border-radius:10px;">
    <b style="color:#00ff88;">PARALLEL${pk.needsPick ? " — PICK ONE TO LOAD SOLD PRICES" : ""}:</b><br>
    ${pk.needsPick && pk.reason ? `<div style="margin:8px 0;">${escHtml(pk.reason)}</div>` : `<div style="margin:8px 0;">Wrong parallel? Pick the right one and prices reload.</div>`}
    <select id="parallelPick" style="width:100%;padding:10px;border-radius:8px;font-size:16px;margin-bottom:10px;">
      <option value="" ${pk.selectedId ? "" : "selected"} disabled>Choose the parallel on your card…</option>
      ${top.length ? `<optgroup label="Most likely">${top.map(opt).join("")}</optgroup><optgroup label="All parallels for this card">${rest.map(opt).join("")}</optgroup>` : pk.options.map(opt).join("")}
    </select>
    <button onclick="pickParallel()" style="background:#00c853;color:white;border:none;padding:12px;border-radius:8px;width:100%;font-weight:bold;cursor:pointer;">LOAD SOLD PRICES FOR THIS PARALLEL</button>
    <div id="parallelPickStatus" style="margin-top:8px;"></div>
    ${sales ? `<div style="margin-top:10px;"><b>Recent sales:</b>${sales}</div>` : ""}
  </div>`;
}

async function pickParallel() {
  const data = window.gvLast;
  const sel = document.getElementById("parallelPick");
  const status = document.getElementById("parallelPickStatus");
  if (!data?.parallelPicker || !sel?.value) { if (status) status.textContent = "Choose a parallel first."; return; }
  const pk = data.parallelPicker;
  const choice = pk.options.find((o) => o.id === sel.value);
  status.textContent = "Loading sold prices…";
  try {
    const r = await fetch(`/api/parallel-comps?cardId=${encodeURIComponent(pk.cardId)}&parallelId=${encodeURIComponent(sel.value)}`);
    const c = await r.json();
    if (!r.ok) throw new Error(c.error || "Could not load sold prices.");
    // The user confirmed the parallel: it now counts as confirmed for prices and listings.
    const isBase = choice.id === "null";
    data.scan = { ...(data.scan || {}), parallel: isBase ? null : choice.name, numberedTo: choice.numberedTo || data.scan?.numberedTo || null };
    if (data.pipeline?.fields) {
      data.pipeline.fields.parallel = { value: choice.name, status: "confirmed", basis: "Picked by you from the catalog list for this card." };
      data.pipeline.unconfirmed = (data.pipeline.unconfirmed || []).filter((k) => k !== "parallel");
    }
    data.comps = { ...(data.comps || {}), count: c.count, min: c.min, max: c.max, median: c.median, items: c.items, source: c.source,
      status: c.count ? "comps_found" : "no_sales", error: c.count ? null : `No sold sales found for the ${choice.name} parallel in the last 6 months.` };
    if (data.soldComps) {
      const q = String(data.soldComps.query || "");
      if (!isBase && !q.toLowerCase().includes(choice.name.toLowerCase())) data.soldComps.query = q.replace(/\s+RC\b/, "") + ` ${choice.name}${q.match(/\bRC\b/) ? " RC" : ""}`;
    }
    pk.selectedId = choice.id; pk.needsPick = false; pk.reason = null;
    renderScan(data);
  } catch (e) {
    status.textContent = e.message;
  }
}

// Field-by-field verification from the server pipeline. Unresolved fields say "Unconfirmed".
function fieldCheckLines(data) {
  const p = data.pipeline;
  const lines = [];
  if (p && p.fields) {
    const names = { year: "Year", set: "Set", cardNumber: "Card number", parallel: "Parallel", serial: "Serial" };
    lines.push("", "FIELD CHECK:");
    for (const [k, f] of Object.entries(p.fields)) {
      const val = f.value === null || f.value === undefined ? "—" : f.value;
      lines.push(`${names[k] || k} check: ${f.status === "confirmed" ? "Confirmed" : "Unconfirmed"} (${val}) — ${f.basis}`);
    }
    lines.push(`Unconfirmed: ${p.unconfirmed.length ? p.unconfirmed.map(k => names[k] || k).join(", ") : "None"}`);
    if (p.serialCloseup?.needed) lines.push(`Serial close-up: Recommended — ${p.serialCloseup.reason}`);
    else if (p.serialCloseup?.optional) lines.push(`Serial close-up: ${p.serialCloseup.reason}`);
  }
  const a = data.market?.active;
  if (a) {
    lines.push(a.count
      ? `Active eBay asking prices: $${a.low}–$${a.high} (median $${a.median}, ${a.count} listings) — asking prices, not sales`
      : `Active eBay asking prices: ${a.configured ? "none matched" : "not connected yet"} — asking prices, not sales`);
  }
  return lines;
}

function copySearchText() {
  const copyInput = document.getElementById("searchCopyBox");

  copyInput.select();
  copyInput.setSelectionRange(0, 99999);

  navigator.clipboard.writeText(copyInput.value);

  alert("Search phrase copied!");
}
 

function generateProfit() {
  const paid = Number(document.getElementById("paid").value || 0);
  const sell = Number(document.getElementById("sell").value || 0);
  const fees = sell * 0.13;
  const profit = sell - paid - fees;

  document.getElementById("profitBox").innerHTML =
`Paid: $${paid.toFixed(2)}
Estimated Sell Price: $${sell.toFixed(2)}
Estimated Fees: $${fees.toFixed(2)}
Estimated Profit: $${profit.toFixed(2)}`;
}

function getScanText() {
  return document.getElementById("output").innerText || "";
}

function getLine(label, scanText) {
  const line = scanText
    .split("\n")
    .map(l => l.trim())
    .find(l => l.toLowerCase().startsWith(label.toLowerCase()));

  return line ? line.split(":").slice(1).join(":").trim() : "";
}

function generateTikTok() {
  const scan = getScanText();

  const player = getLine("Player", scan);
  const year = getLine("Year", scan);
  const brand = getLine("Brand / Set", scan);
  const parallel = getLine("Parallel / Insert", scan);
  const numbered = getLine("Numbered", scan);
  const value = getLine("Estimated Value Range", scan);
  const hashtags = getLine("Hashtags", scan);

  document.getElementById("tiktokBox").innerHTML =
`🔥 Fresh scan from Genius Vault AI 🔥
This is a ${year} ${brand} ${player} ${parallel} ${numbered} sports card, and this one has serious collector appeal. Cards like this are exactly why the hobby is fun — rookie heat, parallel shine, limited numbering, and a player collectors are watching closely.

Estimated value range: ${value}

Would you grade this, sell it now, or hold it in the vault and wait for the market to move? Drop your opinion below because I want to know what the card community thinks.

First comment:
Would you list this card or keep it in the vault?

${hashtags || "#sportscards #footballcards #thehobby #rookiecards #cardcollector"}`;
}

function generateEbay() {
  const scan = getScanText();

  const verification = getLine("Verification", scan).toLowerCase();
  if (verification.startsWith("rejected") || verification.startsWith("needs_review")) {
    document.getElementById("ebayBox").innerHTML =
`Listing blocked: the scan details could not be verified.

${getLine("Verification", scan)}

Rescan the front and back straight-on in bright light, then try again.`;
    return;
  }

  const clean = v => (v && !/not identified|needs review/i.test(v)) ? v : "";

  const player = clean(getLine("Player", scan)) || "Sports Card";
  const year = clean(getLine("Year", scan));
  const brand = clean(getLine("Brand / Set", scan));
  const cardNumber = clean(getLine("Card Number", scan));
  const parallel = clean(getLine("Parallel / Insert", scan)).replace(/^base$/i, "");
  const numbered = clean(getLine("Numbered", scan));
  const rookie = getLine("Rookie", scan).toLowerCase() === "yes";
  const auto = getLine("Autograph", scan).toLowerCase() === "yes";
  const condition = clean(getLine("Condition Estimate", scan)) || "Please review photos carefully";
  const value = getLine("Estimated Value Range", scan);

  let title = [year, brand, player, cardNumber ? `#${cardNumber.replace(/^#/, "")}` : "", parallel, numbered, rookie ? "RC" : "", auto ? "Auto" : ""]
    .filter(Boolean).join(" ").replace(/\s+/g, " ").trim();
  if (title.length > 80) title = title.slice(0, 80).trim();

  const priceLine = value && !/no sold prices/i.test(value)
    ? `Estimated Value Range: ${value}`
    : "Recent sold prices were not automatically available. Please check comparable sold listings before setting your price.";

  const unconf = clean(getLine("Unconfirmed", scan));
  const checkNote = unconf && !/^none$/i.test(unconf)
    ? `CHECK BEFORE POSTING — unconfirmed: ${unconf}. Compare these against the card or a checklist.\n\n`
    : "";

  document.getElementById("ebayBox").innerHTML = `${checkNote}Title:

${title}

Description:
You are viewing the actual card shown in the photos.

Player: ${player}
Year: ${year || "Not identified"}
Brand/Set: ${brand || "Not identified"}
Card Number: ${cardNumber || "Not identified"}
Parallel/Insert: ${parallel || "Not identified"}
Serial Number: ${numbered || "Not identified"}
Rookie Card: ${rookie ? "Yes" : "No"}
Autograph: ${auto ? "Yes" : "No"}
Condition: ${condition}

Please review all photos carefully for the exact card condition and details.

${priceLine}

Ships protected with care.`;
}
</script>

</body>
