name: Catalog safety tests
on:
  push:
    branches:
      - test/fix-async-reference-scan-20261021
    paths:
      - 'api/_lib/catalog-*.js'
      - 'api/import/**'
      - 'tests/catalog-import.test.js'
      - 'tests/catalog-import-match.test.js'
      - 'tests/catalog-dry-run.test.js'
      - '.github/workflows/catalog-safety.yml'
  workflow_dispatch:
jobs:
  catalog-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run read-only catalog tests
        run: node --experimental-default-type=module --test tests/catalog-import.test.js tests/catalog-import-match.test.js tests/catalog-dry-run.test.js
