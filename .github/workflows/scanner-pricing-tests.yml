name: Scanner pricing regression tests

on:
  push:
    branches:
      - test/fix-async-reference-scan-20261021
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sold-price-buckets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run CardSight sold-price regression tests
        run: node --experimental-default-type=module --test tests/cardsight-sale-bucket.test.mjs tests/catalog-import.test.mjs
